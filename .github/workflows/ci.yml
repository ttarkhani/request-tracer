name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: mvn verify (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/api-gateway
          - services/orders
          - services/inventory
          - log-aggregator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - name: mvn -B verify
        working-directory: ${{ matrix.module }}
        run: mvn -B verify

  dashboard:
    name: dashboard (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: end-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: e2e/pom.xml
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for readiness
        run: ./e2e/wait-for-stack.sh 240
      - name: Run e2e tests
        working-directory: e2e
        run: mvn -B verify
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps
      - name: Stop stack
        if: always()
        run: docker compose down -v
